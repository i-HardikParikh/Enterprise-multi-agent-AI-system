name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          # Use Groq for CI — fastest free provider
          LLM_PROVIDER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LANGCHAIN_TRACING_V2: "false"
        run: pytest tests/ -v --tb=short -q

      - name: Lint
        run: |
          pip install ruff
          ruff check . --ignore E501,E402

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t enterprise-agent:${{ github.sha }} .

      - name: Smoke test
        run: |
          docker run -d --name agent \
            -e LLM_PROVIDER=groq \
            -e GROQ_API_KEY=test \
            -p 8000:8000 \
            enterprise-agent:${{ github.sha }}
          sleep 8
          curl -f http://localhost:8000/health
          docker stop agent
