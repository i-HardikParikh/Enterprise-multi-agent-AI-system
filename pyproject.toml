[project]
name = "enterprise-multi-agent-ai-system"
version = "1.0.0"
description = "A production-grade multi-agent AI system designed for enterprise-scale workflow automation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain==1.2.17",
    "langchain-community==0.4.1",
    "langchain-classic==1.0.7",
    "langgraph==1.1.10",
    "langgraph-checkpoint-sqlite==3.1.0",
    "langchain-groq==1.1.2",
    "langchain-google-genai==4.2.2",
    "langchain-ollama==1.1.0",
    "sentence-transformers==5.4.1",
    "langchain-huggingface==1.2.2",
    "redis==7.4.0",
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "python-multipart==0.0.27",
    "sse-starlette==3.4.2",
    "pandas==3.0.2",
    "numpy==2.4.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pypdf==6.10.2",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "langsmith==0.8.3",
    "langfuse==4.14.1",
    "httpx==0.28.1",
    "requests==2.33.1",
    "beautifulsoup4==4.14.3",
    "python-dotenv==1.2.2",
    "tenacity==9.1.4",
    "structlog==25.5.0",
    "rich==15.0.0",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.3.1",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "aegra-cli==0.9.24; python_version >= '3.12'",
    "ruff"
]

[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'"
]

[tool.ruff.lint]
ignore = [
    "E501",   # line too long
    "E402",   # module level import not at top of file
    "BLE001", # blind except Exception
    "DTZ003", # utcnow without tz
    "B008",   # function call in argument defaults (FastAPI Depends/Security)
    "I001",   # unsorted imports
    "RUF010"  # explicit conversion flag
]
